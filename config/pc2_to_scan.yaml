pointcloud_to_laserscan_zfilter:
  ros__parameters:
    input_topic: "/livox/lidar"
    output_topic: "/scan"

    min_z: -0.1
    max_z:  0.1

    angle_min: -3.141592653589793
    angle_max:  3.141592653589793
    angle_increment: 0.005

    range_min: 0.05
    range_max: 50.0

    use_inf: true
    inf_epsilon: 1.0

    target_frame: "laser"
